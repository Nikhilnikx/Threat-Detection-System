s<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Threat Detection System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">Threat Detection System</p><h1>Security dashboard</h1></div>
    <div class="user-actions"><span>{{ username }}</span><button id="logout">Sign out</button></div>
  </header>
  <main>
    <section class="cards" aria-label="Security overview">
      <article><span>Total events</span><strong id="total-events">—</strong></article>
      <article><span>Open alerts</span><strong id="open-alerts">—</strong></article>
      <article><span>Critical events</span><strong id="critical-events">—</strong></article>
    </section>
    <section class="panel"><h2>Risk breakdown</h2><div id="risk-breakdown" class="breakdown"></div></section>
    <section class="grid">
      <article class="panel"><h2>Recent events</h2><div id="recent-events"></div></article>
      <article class="panel"><h2>Open alerts</h2><div id="recent-alerts"></div></article>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
