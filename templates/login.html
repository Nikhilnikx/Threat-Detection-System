{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="brand">
            THREAT DETECTION SYSTEM
        </div>


        <h1>
            Security console
        </h1>


        <p class="subtitle">
            Sign in to view events, alerts, and runtime monitoring.
        </p>



        <form id="login-form">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <button type="submit">
                Sign in
            </button>



            <p id="error-message"></p>


        </form>


    </div>


</div>


<script src="{{ url_for('static', filename='js/login.js') }}"></script>


{% endblock %}
